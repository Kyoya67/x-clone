name: Backend CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME || 'x-clone' }}
  ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME || 'api' }}
  API_TASK_FAMILY: ${{ vars.API_TASK_FAMILY || 'api' }}
  MIGRATION_TASK_FAMILY: ${{ vars.MIGRATION_TASK_FAMILY || 'db-migrator' }}
  API_ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY || 'api' }}
  MIGRATION_ECR_REPOSITORY: ${{ vars.MIGRATION_ECR_REPOSITORY || 'db-migrator' }}
  API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://api-v1.stg.x-clone.kyo8.dev/health' }}
  DEPLOY_ENV: ${{ vars.DEPLOY_ENV || 'stg' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        run: |
          set -euo pipefail
          test -n "$AWS_ACCOUNT_ID" || { echo 'AWS_ACCOUNT_ID repository variable is required'; exit 1; }

          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          image_tag="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          api_image="$registry/$API_ECR_REPOSITORY:$image_tag"
          migration_image="$registry/$MIGRATION_ECR_REPOSITORY:$image_tag"

          docker buildx build --target app --platform linux/amd64 --load -t "$api_image" .
          docker push "$api_image"

          docker buildx build --target migration --platform linux/amd64 --load -t "$migration_image" .
          docker push "$migration_image"

          {
            echo "API_IMAGE=$api_image"
            echo "MIGRATION_IMAGE=$migration_image"
          } >> "$GITHUB_ENV"

      - name: Register migration task definition
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$MIGRATION_TASK_FAMILY" \
            --query taskDefinition \
            --output json > migration-task-definition.json

          jq --arg image "$MIGRATION_IMAGE" '
            .containerDefinitions |= map(if .name == "migration" then .image = $image else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' migration-task-definition.json > migration-task-definition-next.json

          migration_task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file://migration-task-definition-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "MIGRATION_TASK_DEFINITION_ARN=$migration_task_definition_arn" >> "$GITHUB_ENV"

      - name: Run migration task
        run: |
          set -euo pipefail
          ECS_CLUSTER="$ECS_CLUSTER_NAME" \
          ECS_MIGRATION_TASK_DEFINITION="$MIGRATION_TASK_DEFINITION_ARN" \
          DEPLOY_ENV="$DEPLOY_ENV" \
            bash scripts/ecs-migrate.sh up

      - name: Register API task definition
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$API_TASK_FAMILY" \
            --query taskDefinition \
            --output json > api-task-definition.json

          jq --arg image "$API_IMAGE" '
            .containerDefinitions |= map(if .name == "api" then .image = $image else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' api-task-definition.json > api-task-definition-next.json

          api_task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file://api-task-definition-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "API_TASK_DEFINITION_ARN=$api_task_definition_arn" >> "$GITHUB_ENV"

      - name: Update ECS service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --task-definition "$API_TASK_DEFINITION_ARN" \
            --output json >/dev/null

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"

      - name: Check API health
        run: curl --fail --show-error --silent --location --max-time 30 "$API_HEALTH_URL"
