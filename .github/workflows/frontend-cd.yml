name: Frontend CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
    paths:
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/tsconfig*.json"
      - "frontend/vite.config.ts"
      - "frontend/vitest.config.ts"
      - "frontend/.prettierrc"
      - "frontend/.prettierignore"
      - ".github/workflows/frontend-cd.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets[github.ref_name == 'main' && 'AWS_ROLE_ARN_PRD' || 'AWS_ROLE_ARN_STG'] }}
  AMPLIFY_APP_ID: ${{ vars[github.ref_name == 'main' && 'AMPLIFY_APP_ID_PRD' || 'AMPLIFY_APP_ID_STG'] }}
  AMPLIFY_BRANCH_NAME: ${{ vars.AMPLIFY_BRANCH_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate deployment variables
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo 'AWS_REGION repository variable is required'; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo 'AWS_ROLE_ARN_STG or AWS_ROLE_ARN_PRD repository secret is required'; exit 1; }
          test -n "$AMPLIFY_APP_ID" || { echo 'AMPLIFY_APP_ID_STG or AMPLIFY_APP_ID_PRD repository variable is required'; exit 1; }
          test -n "$AMPLIFY_BRANCH_NAME" || { echo 'AMPLIFY_BRANCH_NAME repository variable is required'; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Deploy to Amplify Hosting
        run: |
          set -euo pipefail

          zip_file="$(mktemp --suffix=.zip)"
          trap 'rm -f -- "$zip_file" deployment.json job.json' EXIT

          (cd dist && zip -qr "$zip_file" .)

          aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH_NAME" \
            --output json > deployment.json

          upload_url="$(jq -r '.zipUploadUrl' deployment.json)"
          job_id="$(jq -r '.jobId' deployment.json)"

          curl --fail --silent --show-error \
            --request PUT \
            --upload-file "$zip_file" \
            "$upload_url"

          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH_NAME" \
            --job-id "$job_id"

          for _ in {1..60}; do
            aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH_NAME" \
              --job-id "$job_id" \
              --output json > job.json

            status="$(jq -r '.job.summary.status' job.json)"
            case "$status" in
              SUCCEED)
                exit 0
                ;;
              FAILED | CANCELLED)
                jq '.job.summary' job.json
                exit 1
                ;;
            esac
            sleep 10
          done

          echo 'Timed out waiting for Amplify deployment'
          jq '.job.summary' job.json
          exit 1
