name: Frontend CD

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Frontend CI
    types:
      - completed
    branches:
      - develop
      - main

permissions:
  contents: read
  id-token: write

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets[((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || github.ref_name == 'main') && 'AWS_ROLE_ARN_PRD' || 'AWS_ROLE_ARN_STG'] }}
  AMPLIFY_APP_ID: ${{ vars[((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || github.ref_name == 'main') && 'AMPLIFY_APP_ID_PRD' || 'AMPLIFY_APP_ID_STG'] }}
  AMPLIFY_BRANCH_NAME: ${{ vars[((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || github.ref_name == 'main') && 'AMPLIFY_BRANCH_NAME_PRD' || 'AMPLIFY_BRANCH_NAME_STG'] }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate deployment variables
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo 'AWS_REGION repository variable is required'; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo 'AWS_ROLE_ARN_STG or AWS_ROLE_ARN_PRD repository secret is required'; exit 1; }
          test -n "$AMPLIFY_APP_ID" || { echo 'AMPLIFY_APP_ID_STG or AMPLIFY_APP_ID_PRD repository variable is required'; exit 1; }
          test -n "$AMPLIFY_BRANCH_NAME" || { echo 'AMPLIFY_BRANCH_NAME_STG or AMPLIFY_BRANCH_NAME_PRD repository variable is required'; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Deploy to Amplify Hosting
        run: |
          set -euo pipefail

          zip_file="$(mktemp --suffix=.zip)"
          trap 'rm -f -- "$zip_file" deployment.json job.json' EXIT
          rm -f "$zip_file"

          (cd dist && zip -qr "$zip_file" .)

          aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH_NAME" \
            --output json > deployment.json

          upload_url="$(jq -r '.zipUploadUrl' deployment.json)"
          job_id="$(jq -r '.jobId' deployment.json)"

          curl --fail --silent --show-error \
            --request PUT \
            --upload-file "$zip_file" \
            "$upload_url"

          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH_NAME" \
            --job-id "$job_id"

          for _ in {1..60}; do
            aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH_NAME" \
              --job-id "$job_id" \
              --output json > job.json

            status="$(jq -r '.job.summary.status' job.json)"
            case "$status" in
              SUCCEED)
                exit 0
                ;;
              FAILED | CANCELLED)
                jq '.job.summary' job.json
                exit 1
                ;;
            esac
            sleep 10
          done

          echo 'Timed out waiting for Amplify deployment'
          jq '.job.summary' job.json
          exit 1
